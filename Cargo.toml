[workspace]
resolver = "2"
members = [
    "crates/hygress-core",
    "crates/hygress-adapter",
    "crates/hygress-egress",
    "crates/hygress-gateway",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.83"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
bytes = "1"
regex = "1"
arc-swap = "1"
dashmap = "6"
async-trait = "0.1"
http = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
prometheus = "0.14"
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
futures = "0.3"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
