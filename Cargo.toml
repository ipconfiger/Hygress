[workspace]
resolver = "2"
members = [
    "crates/hygress-core",
    "crates/hygress-adapter",
    "crates/hygress-egress",
    "crates/hygress-gateway",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
# R-13 (MSRV alignment): raised from 1.83 to match direct dependency MSRVs
# (kube 4.2 / reqwest 0.13 / pingora 0.8 are ≥1.84–1.89). The repo toolchain
# (rust-toolchain.toml) stays at 1.98.
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
bytes = "1"
regex = "1"
arc-swap = "1"
dashmap = "6"
async-trait = "0.1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider", "stream"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
prometheus = "0.14"
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
