[package]
name = "hygress-adapter"
description = "Hygress control-plane adapter (strategy 2): read-only Kubernetes CRD consumer that maps GPUStack-written Higress CRDs (Ingress/McpBridge/WasmPlugin/EnvoyFilter/Secret/ConfigMap/IngressClass) into an ArcSwap-backed RouteTable snapshot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hygress-core = { path = "../hygress-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
base64 = { workspace = true }
# `futures` is an existing workspace dependency (already used by hygress-egress /
# hygress-gateway, and transitively required by `kube`); it is needed here to drive the
# `kube::runtime::watcher` stream (`.next()` via `StreamExt`). Not a new external crate.
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
